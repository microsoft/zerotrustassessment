on: [pull_request]

jobs:
  validate:

    runs-on: windows-latest

    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
    - name: Install Prerequisites
      run: .\build\powershell\Install-Prerequisites.ps1
      shell: pwsh
    - name: Validate
      run: .\code-tests\pester.ps1
      shell: pwsh
